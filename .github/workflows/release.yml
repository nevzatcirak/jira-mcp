name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, without 'v' prefix, e.g. 1.0.1)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Guard — input must be valid semver
        run: |
          VERSION="${{ inputs.version }}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not valid semver (expected e.g. 1.0.1 or 1.0.1-beta.1)."
            exit 1
          fi

      - name: Use Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Bump version (package.json + package-lock.json)
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile covers linux native deps
        shell: bash
        run: |
          grep -q "node_modules/@rollup/rollup-linux-x64-gnu" package-lock.json \
            || { echo "::error::lockfile missing linux native deps - regenerate on linux or with npm >= 9 (npm/cli#4828)"; exit 1; }
          grep -q "node_modules/@esbuild/linux-x64" package-lock.json \
            || { echo "::error::lockfile missing esbuild linux native deps - regenerate on linux or with npm >= 9 (npm/cli#4828)"; exit 1; }

      - name: Test (release sanity check)
        run: npm test

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD main --follow-tags
