name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify lockfile covers linux native deps
        shell: bash
        run: |
          grep -q "node_modules/@rollup/rollup-linux-x64-gnu" package-lock.json \
            || { echo "::error::lockfile missing linux native deps - regenerate on linux or with npm >= 9 (npm/cli#4828)"; exit 1; }
          grep -q "node_modules/@esbuild/linux-x64" package-lock.json \
            || { echo "::error::lockfile missing esbuild linux native deps - regenerate on linux or with npm >= 9 (npm/cli#4828)"; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (dry-run, node 20 only)
        if: matrix.node-version == 20
        run: npm pack --dry-run | tee npm-pack-output.txt

      - name: Upload pack artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-output
          path: npm-pack-output.txt
          retention-days: 7
