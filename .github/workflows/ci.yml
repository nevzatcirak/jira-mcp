name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (dry-run, node 20 only)
        if: matrix.node-version == 20
        run: npm pack --dry-run | tee npm-pack-output.txt

      - name: Upload pack artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-output
          path: npm-pack-output.txt
          retention-days: 7
